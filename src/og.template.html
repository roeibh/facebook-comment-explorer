<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;display:flex;flex-direction:column;justify-content:center;
  padding:0 84px;background:#0d1117;color:#e6edf3;
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.kicker{font-size:26px;color:#4c9aff;font-weight:700;letter-spacing:.02em;margin-bottom:26px}
h1{font-size:78px;line-height:1.06;letter-spacing:-.03em;font-weight:800;max-width:16ch}
p{font-size:31px;color:#9198a1;margin-top:30px;max-width:30ch;line-height:1.4}
.row{display:flex;gap:14px;margin-top:52px;flex-wrap:wrap}
.pill{border:1px solid #30363d;background:#161b22;border-radius:999px;
  padding:11px 24px;font-size:23px;color:#c9d1d9}
.bar{position:absolute;left:0;top:0;width:100%;height:12px;background:#1877f2}
</style></head><body>
<div class="bar"></div>
<div class="kicker">FREE BOOKMARKLET &middot; NO EXTENSION</div>
<h1>Expand &amp; search every Facebook comment</h1>
<p>One click loads all of them, replies included.</p>
<div class="row">
  <span class="pill">Instant search</span>
  <span class="pill">Whole threads</span>
  <span class="pill">CSV &amp; JSON export</span>
</div>
</body></html>
