name: Verify build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check src/fb-comment-explorer.js
      - run: npm run build
      # dist/ and docs/index.html are committed, so a stale build should fail CI.
      - run: git diff --exit-code -- dist/bookmarklet.txt docs/index.html
